<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Task Hub & Community Updates</title>

<style>
:root{
  --panel:#071e1d;
  --teal1:#2ec00d;
  --teal2:#24b80d;
  --btn-text:#f5f5f5;
  --muted:rgba(255,255,255,0.75);
  --label-red:#ff2f5a;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#061214,#081617,#071013);
  color:#fff;
  overflow-x:hidden;
}

.center-wrap{
  display:flex;
  justify-content:center;
  padding:40px 0;
}

.wrap{
  max-width:400px;
  width:80%;
  background:var(--panel);
  border-radius:20px;
  padding:22px 20px 30px;
  text-align:center;
  position:relative;

  box-shadow:
    0 0 0 1px rgba(14,242,213,0.35),
    0 0 20px rgba(14,242,213,0.25),
    0 0 40px rgba(19,242,255,0.15),
    0 25px 45px rgba(0,0,0,0.7);

  animation: edgeGlow 3s ease-in-out infinite alternate;
}

@keyframes edgeGlow{
  from{
    box-shadow:
      0 0 0 1px rgba(67, 242, 14, 0.25),
      0 0 16px rgba(14, 242, 37, 0.18),
      0 0 32px rgba(19,242,255,0.1),
      0 25px 45px rgba(0,0,0,0.7);
  }
  to{
    box-shadow:
      0 0 0 1px rgba(14, 242, 41, 0.45),
      0 0 28px rgba(14,242,213,0.35),
      0 0 55px rgba(19,242,255,0.22),
      0 25px 45px rgba(0,0,0,0.7);
  }
}

.marquee{
  background:linear-gradient(90deg,var(--teal1),var(--teal2));
  color:var(--btn-text);
  font-weight:900;
  padding:10px 0;
  border-radius:12px;
  margin-bottom:12px;
  font-size:14px;
  letter-spacing:1px;
}

.profile-box{
  width:180px;
  height:180px;
  margin:12px auto 18px;
  border-radius:18px;
  overflow:hidden;
  border:4px solid rgba(14,242,213,0.25);
}
.profile-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  font-size:24px;
  margin:6px 0;
  font-weight:800;
}
.subtitle{
  font-size:14px;
  color:var(--muted);
  margin-bottom:18px;
}

.pill{
  display:block;
  width:100%;
  padding:18px 0;
  margin:14px 0;
  border-radius:50px;
  background:linear-gradient(90deg,var(--teal1),var(--teal2));
  color:var(--btn-text);
  font-weight:900;
  font-size:17px;
  text-decoration:none;
  letter-spacing:1px;
}
.pill-sub{
  font-size:12px;
  color:var(--muted);
}

.hurry{
  color:var(--teal1);
  font-weight:800;
  margin-top:6px;
}

.timer{
  display:flex;
  justify-content:center;
  gap:15px;
  margin:16px 0 20px;
}
.cell{
  background:rgba(1,40,38,0.6);
  padding:12px 16px;
  border-radius:10px;
  width:70px;
}
.num{
  font-size:28px;
  font-weight:800;
}
.lab{
  font-size:12px;
  color:var(--label-red);
  margin-top:4px;
  font-weight:700;
}

.features{margin-bottom:18px;}
.feature-item{
  margin:6px 0;
  font-weight:700;
  color:var(--muted);
  font-size:14px;
}

.divider{
  height:1px;
  background:rgba(255,255,255,0.08);
  margin:20px auto;
}

.exp h2{font-size:18px; margin: 6px 0;}
.big{
  color:var(--teal1);
  font-weight:800;
  font-size:15px;
}
.mini{
  font-size:11px;
  opacity:0.6;
  letter-spacing:1.5px;
  margin-top:4px;
}

/* DISCLAIMER SECTION */
.disclaimer-box{
  margin-top:20px;
  padding:12px 14px;
  background:rgba(0,0,0,0.3);
  border-radius:8px;
  border-left:3px solid var(--label-red);
  text-align:left;
}
.disclaimer-title{
  font-size:11px;
  font-weight:700;
  color:var(--label-red);
  letter-spacing:1px;
  margin-bottom:4px;
}
.disclaimer-text{
  font-size:10px;
  line-height:1.5;
  color:rgba(255,255,255,0.55);
}
</style>
